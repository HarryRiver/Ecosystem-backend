version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecocollect-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2212
      POSTGRES_DB: rac
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
